plugins {
    id 'com.android.application'
}

android {
    namespace 'com.norvex.roleplay'
    compileSdk 34

    defaultConfig {
        applicationId 'com.norvex.roleplay'
        minSdk 21
        targetSdk 34
        // Nomor versi OTOMATIS dari nomor build GitHub (tak perlu dipikir).
        // Ditulis defensif: tak boleh null dalam kondisi apa pun.
        def vcEnv = System.getenv("VC")
        versionCode vcEnv ? Integer.parseInt(vcEnv.trim()) : 1
        versionName "1.0." + (vcEnv ? vcEnv.trim() : "1")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        nvx {
            storeFile file("../norvex.keystore")
            storePassword System.getenv("KS_PASS") ?: "norvex123"
            keyAlias "norvex"
            keyPassword System.getenv("KS_PASS") ?: "norvex123"
        }
    }

    buildTypes {
        debug {
            // Install langsung tanpa tanda tangan, tapi TANPA alat pantau
            // debug (debuggable=false) agar ringan seperti build rilis.
            debuggable false
        }
        release {
            // Tanpa minify: jembatan JS window.AppInventor tidak boleh dibuang.
            minifyEnabled false
            // Tanda tangan: kunci tetap dari secret (bootstrap: norvex123).
            signingConfig signingConfigs.nvx
        }
    }
}

// SENGAJA tanpa dependencies: hanya framework Android (hemat kuota & waktu build).
